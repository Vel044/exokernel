<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1310" viewBox="0 0 1800 1310" role="img"><title>LiteEth：七个外部入口与 Linux 依赖</title><desc>核查本地 Linux 6.12.75。上方为三个框架对七个入口的回调，不画内部调用。下方为驱动依赖的模块分类，接口名称是代表性示例，完整直接依赖记录见同目录源码核查.json。依赖箭头从整个驱动模块指向服务分类，不表示每个入口都调用每个依赖。编译期宏属于编译依赖。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b8630a"/></marker></defs>
