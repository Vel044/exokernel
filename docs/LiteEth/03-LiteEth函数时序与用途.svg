<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img">
<title>LiteEth 驱动函数流程</title>
<desc>从 probe 初始化、open 打开，到运行期间的发送、中断、接收和统计，再到 stop 停止和 remove 移除。setup_slots 由 probe 调用，rx 由 interrupt 调用；发送、中断和统计独立触发，不表示依次执行。remove 返回后由设备框架回收 devm 资源。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#60758b"/></marker></defs>
<rect width="1800" height="1260" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#1e293b">
<text x="60" y="68" font-size="44" font-weight="700">LiteEth 驱动函数流程</text>
<text x="60" y="158" font-size="30" fill="#1c5fa8" font-weight="700">1 初始化</text>
<rect x="240" y="112" width="920" height="140" rx="16" fill="#f6faff" stroke="#8db4e4" stroke-width="2.5"/>
<text x="268" y="164" font-size="34" fill="#1459a6" font-weight="700" font-family="Menlo,Consolas,monospace">liteeth_probe()</text>
<text x="268" y="213" font-size="30" fill="#334155" font-weight="400">映射硬件资源，初始化并注册网卡</text>
<rect x="1210" y="112" width="530" height="140" rx="16" fill="#f6faff" stroke="#8db4e4" stroke-width="2.5"/>
<text x="1238" y="164" font-size="34" fill="#1459a6" font-weight="700" font-family="Menlo,Consolas,monospace">liteeth_setup_slots()</text>
<text x="1238" y="213" font-size="30" fill="#334155" font-weight="400">读取收发槽数量与大小</text>
<path d="M1160 182 H1210" fill="none" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M700 252 V306" fill="none" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="60" y="354" font-size="30" fill="#1c5fa8" font-weight="700">2 打开</text>
<rect x="240" y="306" width="1500" height="140" rx="16" fill="#f6faff" stroke="#8db4e4" stroke-width="2.5"/>
<text x="268" y="358" font-size="34" fill="#1459a6" font-weight="700" font-family="Menlo,Consolas,monospace">liteeth_open()</text>
<text x="268" y="407" font-size="30" fill="#334155" font-weight="400">绑定 IRQ，打开设备中断和发送队列</text>
<path d="M990 446 V500" fill="none" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="60" y="546" font-size="30" fill="#1c5fa8" font-weight="700">3 运行</text>
<rect x="240" y="500" width="1500" height="398" rx="16" fill="#fafcfe" stroke="#c8d5e3" stroke-width="2.5"/>
<text x="270" y="546" font-size="30" fill="#334155" font-weight="400">发送、中断、统计按需触发，可反复发生</text>
<text x="270" y="595" font-size="28" fill="#526575" font-weight="400">发送请求</text>
<text x="770" y="595" font-size="28" fill="#526575" font-weight="400">硬件中断</text>
<text x="1270" y="595" font-size="28" fill="#526575" font-weight="400">统计查询</text>
<rect x="260" y="615" width="470" height="140" rx="16" fill="#f6faff" stroke="#8db4e4" stroke-width="2.5"/>
<text x="288" y="667" font-size="34" fill="#1459a6" font-weight="700" font-family="Menlo,Consolas,monospace">liteeth_start_xmit()</text>
<text x="288" y="716" font-size="30" fill="#334155" font-weight="400">复制数据到发送槽并启动发送</text>
<rect x="760" y="615" width="470" height="140" rx="16" fill="#f6faff" stroke="#8db4e4" stroke-width="2.5"/>
<text x="788" y="667" font-size="34" fill="#1459a6" font-weight="700" font-family="Menlo,Consolas,monospace">liteeth_interrupt()</text>
<text x="788" y="716" font-size="30" fill="#334155" font-weight="400">处理收发中断并清除事件</text>
<rect x="1240" y="615" width="480" height="140" rx="16" fill="#f6faff" stroke="#8db4e4" stroke-width="2.5"/>
<text x="1268" y="667" font-size="34" fill="#1459a6" font-weight="700" font-family="Menlo,Consolas,monospace">liteeth_get_stats64()</text>
<text x="1268" y="716" font-size="30" fill="#334155" font-weight="400">汇总收发数量与错误统计</text>
<path d="M995 755 V790" fill="none" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="760" y="790" width="960" height="88" rx="16" fill="#edf8f6" stroke="#65b7aa" stroke-width="2.5"/>
<text x="788" y="845" font-size="34" fill="#1459a6" font-weight="700" font-family="Menlo,Consolas,monospace">liteeth_rx()</text>
<text x="1080" y="845" font-size="30" fill="#334155" font-weight="400">复制接收槽数据，交给网络栈</text>
<path d="M990 898 V952" fill="none" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="60" y="1000" font-size="30" fill="#1c5fa8" font-weight="700">4 停止</text>
<rect x="240" y="952" width="1500" height="120" rx="16" fill="#fff9f1" stroke="#dfb880" stroke-width="2.5"/>
<text x="268" y="1004" font-size="34" fill="#1459a6" font-weight="700" font-family="Menlo,Consolas,monospace">liteeth_stop()</text>
<text x="268" y="1053" font-size="30" fill="#334155" font-weight="400">停止发送，关闭设备中断并解除 IRQ 绑定</text>
<path d="M990 1072 V1118" fill="none" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="60" y="1166" font-size="30" fill="#1c5fa8" font-weight="700">5 移除</text>
<rect x="240" y="1118" width="1500" height="120" rx="16" fill="#fff9f1" stroke="#dfb880" stroke-width="2.5"/>
<text x="268" y="1170" font-size="34" fill="#1459a6" font-weight="700" font-family="Menlo,Consolas,monospace">liteeth_remove()</text>
<text x="268" y="1219" font-size="30" fill="#334155" font-weight="400">注销网卡；返回后由框架回收资源</text>
</g></svg>
