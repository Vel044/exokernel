<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150" role="img"><title>LiteEth：三种调用入口与接收返回路径</title><desc>本地 Linux 6.12.75 源码核查。网络设备核心、platform 设备框架、IRQ 框架分别调用四个、两个、一个驱动入口，与图02保持一致，不展开驱动内部函数。用户工具及 syscall 为 RV64/ARM64 的示例；具体镜像未跟踪。绿色虚线表示接收报文流向，不是 IRQ 回调直接执行完整网络协议栈；netif_rx 的排队与软中断处理在此合并为简化路径。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="rx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker></defs>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<text x="40" y="51" font-size="37" fill="#172b3a" font-weight="700">LiteEth：三种调用入口与接收返回路径</text>
<text x="40" y="91" font-size="22" fill="#526575" font-weight="400">Linux 6.12.75 · 灰色箭头：调用 / 事件分发；绿色虚线：接收报文流向</text>
