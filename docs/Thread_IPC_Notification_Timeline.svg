<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2460" viewBox="0 0 1500 2460">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; letter-spacing: 0; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #526071; }
      .head { font-size: 24px; font-weight: 700; fill: #ffffff; }
      .head-sub { font-size: 16px; fill: #e8eef8; }
      .phase { font-size: 19px; font-weight: 700; }
      .phase-sub { font-size: 15px; fill: #667085; }
      .event { font-size: 16px; font-weight: 600; fill: #172033; }
      .detail { font-size: 14px; fill: #526071; }
      .local { font-size: 15px; font-weight: 600; }
      .state { font-size: 14px; font-weight: 700; }
      .life { stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 8 8; }
      .call-main { stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .call-worker { stroke: #15803d; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .schedule { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow-gray); }
      .return { stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1500" height="2460" fill="#f7f8fa"/>
  <text x="70" y="64" class="title">Thread + IPC + Notification 测试 Timeline</text>
  <text x="70" y="98" class="subtitle">单核、单EL0地址空间：实线表示系统调用，虚线表示Kernel调度/返回，竖直方向表示时间向下</text>

  <!-- 三个参与者 -->
  <rect x="70" y="132" width="380" height="86" rx="8" fill="#2563eb"/>
  <text x="260" y="169" text-anchor="middle" class="head">EL0 主线程</text>
  <text x="260" y="197" text-anchor="middle" class="head-sub">apps::system_smoke::ipc::run()</text>

  <rect x="560" y="132" width="380" height="86" rx="8" fill="#b42318"/>
  <text x="750" y="169" text-anchor="middle" class="head">EL1 Kernel</text>
  <text x="750" y="197" text-anchor="middle" class="head-sub">对象校验 · 阻塞唤醒 · 调度 · 消息复制</text>

  <rect x="1050" y="132" width="380" height="86" rx="8" fill="#15803d"/>
  <text x="1240" y="169" text-anchor="middle" class="head">EL0 Worker线程</text>
  <text x="1240" y="197" text-anchor="middle" class="head-sub">worker(arg, handle, ipc_va)</text>

  <line x1="260" y1="218" x2="260" y2="2370" class="life"/>
  <line x1="750" y1="218" x2="750" y2="2370" class="life"/>
  <line x1="1240" y1="218" x2="1240" y2="2370" class="life"/>

  <!-- 阶段一 -->
  <rect x="45" y="242" width="1410" height="650" rx="8" fill="#eef4ff" stroke="#c7d7fe"/>
  <text x="70" y="276" class="phase" fill="#1849a9">1　创建对象、创建线程、首次异步唤醒</text>
  <text x="70" y="302" class="phase-sub">主线程发布Handle后阻塞；Kernel调度Worker，Worker用Notification唤醒主线程</text>

  <rect x="105" y="326" width="310" height="54" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="260" y="348" text-anchor="middle" class="local">_start → init_heap → run()</text>
  <text x="260" y="369" text-anchor="middle" class="detail">用户态普通函数调用，不进入Kernel</text>

  <line x1="260" y1="414" x2="750" y2="414" class="call-main"/>
  <text x="505" y="406" text-anchor="middle" class="event">SYS_NOTIFICATION_CREATE</text>
  <line x1="750" y1="449" x2="260" y2="449" class="return"/>
  <text x="505" y="441" text-anchor="middle" class="event">返回 NotificationHandle</text>

  <line x1="260" y1="488" x2="750" y2="488" class="call-main"/>
  <text x="505" y="480" text-anchor="middle" class="event">SYS_ENDPOINT_CREATE</text>
  <line x1="750" y1="523" x2="260" y2="523" class="return"/>
  <text x="505" y="515" text-anchor="middle" class="event">返回 EndpointHandle</text>

  <rect x="105" y="548" width="310" height="58" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="260" y="571" text-anchor="middle" class="local">AtomicU64.store(handle, Release)</text>
  <text x="260" y="593" text-anchor="middle" class="detail">只写共享EL0内存，不进入Kernel</text>

  <line x1="260" y1="640" x2="750" y2="640" class="call-main"/>
  <text x="505" y="632" text-anchor="middle" class="event">SYS_THREAD_CREATE(worker, 0, 128)</text>
  <rect x="610" y="659" width="280" height="66" rx="6" fill="#fee4e2" stroke="#fda29b"/>
  <text x="750" y="682" text-anchor="middle" class="local">分配TCB、用户栈、IPC Buffer</text>
  <text x="750" y="705" text-anchor="middle" class="detail">Worker状态：Ready；返回ThreadHandle</text>

  <line x1="260" y1="756" x2="750" y2="756" class="call-main"/>
  <text x="505" y="748" text-anchor="middle" class="event">NOTIFICATION_WAIT → 主线程 Blocked</text>
  <line x1="750" y1="792" x2="1240" y2="792" class="schedule"/>
  <text x="995" y="784" text-anchor="middle" class="event">schedule Worker → Running</text>

  <rect x="1085" y="813" width="310" height="52" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="1240" y="835" text-anchor="middle" class="local">AtomicU64.load(handle, Acquire)</text>
  <text x="1240" y="856" text-anchor="middle" class="detail">构造Notification与Endpoint封装</text>

  <!-- 阶段二 -->
  <rect x="45" y="912" width="1410" height="480" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="70" y="946" class="phase" fill="#166534">2　Notification启动握手 + Endpoint Call/Reply</text>

  <line x1="1240" y1="988" x2="750" y2="988" class="call-worker"/>
  <text x="995" y="980" text-anchor="middle" class="event">SIGNAL(badge=0x2)</text>
  <rect x="624" y="1006" width="252" height="48" rx="6" fill="#fee4e2" stroke="#fda29b"/>
  <text x="750" y="1036" text-anchor="middle" class="local">pending |= 0x2；主线程 Ready</text>

  <line x1="1240" y1="1080" x2="750" y2="1080" class="call-worker"/>
  <text x="995" y="1072" text-anchor="middle" class="event">ENDPOINT_RECV → Worker Blocked</text>
  <line x1="750" y1="1118" x2="260" y2="1118" class="schedule"/>
  <text x="505" y="1110" text-anchor="middle" class="event">schedule 主线程；WAIT返回0x2</text>

  <rect x="105" y="1140" width="310" height="54" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="260" y="1162" text-anchor="middle" class="local">IPC Buffer写入 label=0x100, value=41</text>
  <text x="260" y="1183" text-anchor="middle" class="detail">用户态直接写自己的IPC页</text>

  <line x1="260" y1="1226" x2="750" y2="1226" class="call-main"/>
  <text x="505" y="1218" text-anchor="middle" class="event">ENDPOINT_CALL → 主线程 Blocked</text>
  <rect x="610" y="1245" width="280" height="62" rx="6" fill="#fee4e2" stroke="#fda29b"/>
  <text x="750" y="1268" text-anchor="middle" class="local">匹配等待中的Worker</text>
  <text x="750" y="1291" text-anchor="middle" class="detail">复制消息并生成一次性ReplyHandle</text>
  <line x1="750" y1="1332" x2="1240" y2="1332" class="schedule"/>
  <text x="995" y="1324" text-anchor="middle" class="event">Worker RECV返回，读取41</text>

  <!-- 阶段三 -->
  <rect x="45" y="1412" width="1410" height="430" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="70" y="1446" class="phase" fill="#9a3412">3　Worker回复 + 单向Send/Recv</text>

  <rect x="1085" y="1470" width="310" height="52" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="1240" y="1492" text-anchor="middle" class="local">读取41，IPC Buffer写入回复42</text>
  <text x="1240" y="1513" text-anchor="middle" class="detail">仍是EL0普通内存访问</text>
  <line x1="1240" y1="1550" x2="750" y2="1550" class="call-worker"/>
  <text x="995" y="1542" text-anchor="middle" class="event">ENDPOINT_REPLY(ReplyHandle)</text>
  <line x1="750" y1="1586" x2="260" y2="1586" class="schedule"/>
  <text x="505" y="1578" text-anchor="middle" class="event">唤醒主线程；CALL返回42</text>

  <rect x="105" y="1610" width="310" height="46" rx="6" fill="#ffedd5" stroke="#fdba74"/>
  <text x="260" y="1639" text-anchor="middle" class="local">写入单向消息 label=0x200, value=7</text>
  <line x1="260" y1="1688" x2="750" y2="1688" class="call-main"/>
  <text x="505" y="1680" text-anchor="middle" class="event">ENDPOINT_SEND；随后WAIT(0x4)</text>
  <line x1="750" y1="1726" x2="1240" y2="1726" class="schedule"/>
  <text x="995" y="1718" text-anchor="middle" class="event">Worker RECV得到7</text>
  <line x1="1240" y1="1770" x2="750" y2="1770" class="call-worker"/>
  <text x="995" y="1762" text-anchor="middle" class="event">SIGNAL(0x4) → 唤醒主线程</text>
  <line x1="750" y1="1808" x2="260" y2="1808" class="return"/>
  <text x="505" y="1800" text-anchor="middle" class="event">WAIT返回0x4</text>

  <!-- 阶段四 -->
  <rect x="45" y="1862" width="1410" height="350" rx="8" fill="#fdf2fa" stroke="#fcceee"/>
  <text x="70" y="1896" class="phase" fill="#9e165f">4　ReplyRecv组合操作与Worker退出</text>

  <line x1="260" y1="1940" x2="750" y2="1940" class="call-main"/>
  <text x="505" y="1932" text-anchor="middle" class="event">CALL(value=9) → Worker读取请求</text>
  <line x1="750" y1="1978" x2="1240" y2="1978" class="schedule"/>
  <text x="995" y="1970" text-anchor="middle" class="event">schedule Worker</text>
  <line x1="1240" y1="2020" x2="750" y2="2020" class="call-worker"/>
  <text x="995" y="2012" text-anchor="middle" class="event">REPLY_RECV：回复10并立即再次Blocked</text>
  <line x1="750" y1="2058" x2="260" y2="2058" class="return"/>
  <text x="505" y="2050" text-anchor="middle" class="event">主线程CALL返回10</text>
  <line x1="260" y1="2098" x2="750" y2="2098" class="call-main"/>
  <text x="505" y="2090" text-anchor="middle" class="event">SEND收尾消息10；WAIT(0x8)</text>
  <line x1="750" y1="2136" x2="1240" y2="2136" class="schedule"/>
  <text x="995" y="2128" text-anchor="middle" class="event">Worker收到消息 → SIGNAL(0x8) → THREAD_EXIT</text>
  <rect x="1158" y="2160" width="164" height="34" rx="17" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1240" y="2182" text-anchor="middle" class="state" fill="#166534">Worker：Exited</text>

  <!-- 阶段五 -->
  <rect x="45" y="2232" width="1410" height="150" rx="8" fill="#f2f4f7" stroke="#d0d5dd"/>
  <text x="70" y="2266" class="phase">5　安全性收尾检查</text>
  <text x="70" y="2298" class="detail">① 对旧ThreadHandle定向YIELD → SYS_ERR_NOT_FOUND　 ② SIGNAL后POLL取得0x10　 ③ 先SIGNAL再WAIT取得0x20</text>
  <text x="70" y="2328" class="detail">④ DESTROY Notification后再次POLL → SYS_ERR_NOT_FOUND　 ⑤ SYS_EXIT清理Endpoint、线程、映射和任务资源</text>
  <line x1="260" y1="2358" x2="750" y2="2358" class="call-main"/>
  <text x="505" y="2350" text-anchor="middle" class="event">SYS_EXIT(0) → 测试通过</text>

  <!-- 图例 -->
  <rect x="45" y="2400" width="1410" height="42" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
  <line x1="80" y1="2421" x2="145" y2="2421" class="call-main"/>
  <text x="158" y="2427" class="detail">主线程系统调用</text>
  <line x1="355" y1="2421" x2="420" y2="2421" class="call-worker"/>
  <text x="433" y="2427" class="detail">Worker系统调用</text>
  <line x1="635" y1="2421" x2="700" y2="2421" class="schedule"/>
  <text x="713" y="2427" class="detail">调度、唤醒或返回</text>
  <rect x="955" y="2409" width="28" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="995" y="2427" class="detail">用户态直接内存操作，不执行SVC</text>
</svg>
